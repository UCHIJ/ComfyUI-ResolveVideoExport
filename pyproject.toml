[project]
name = "comfyui-davinci-resolve-export"  # must be unique on the registry, lowercase with hyphens
description = "Export ComfyUI videos as DNxHR or ProRes .mov files that DaVinci Resolve (including the free version) can import, with audio and correct color."
version = "1.0.0"  # bump this and push to publish an update
license = { file = "LICENSE" }
requires-python = ">=3.9"
dependencies = []  # PyAV already ships with ComfyUI

[project.urls]
Repository = "https://github.com/UCHIJ/ComfyUI-ResolveVideoExport"

[tool.comfy]
PublisherId = "uchij"  # your publisher ID from registry.comfy.org (the part after the @)
DisplayName = "Export Video for DaVinci Resolve"
Icon = ""  # optional: URL to a square image, e.g. the Leonardo portrait cropped
